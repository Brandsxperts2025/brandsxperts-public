<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Configura tu Negocio - BrandsXperts</title>
    <style>
        body {
            font-family: system-ui;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🚀 Configura tu Sitio</h2>
        <div style="text-align: center;">
            <h2>🚀 Activa tu Agencia</h2>
            <p>Para activar tu cuenta, contáctanos por WhatsApp con el plan que deseas.</p>

            <a id="wa-link" href="#" style="
                display: block; 
                background: #25D366; 
                color: white; 
                padding: 15px; 
                border-radius: 8px; 
                text-decoration: none; 
                font-weight: bold; 
                margin-top: 20px;">
                💬 Activar por WhatsApp
            </a>

            <p style="font-size: 0.8rem; color: #888; margin-top: 20px;">
                Aceptamos Yape, Plin y Transferencias.<br>
                Activación manual en minutos.
            </p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const plan = params.get('plan') || 'plan2';
        const msg = `Hola, quiero activar mi agencia BrandsXperts.\nPlan elegido: ${plan}`;
        document.getElementById('wa-link').href = `https://wa.me/51999999999?text=${encodeURIComponent(msg)}`;
    </script>
</body>

</html>
